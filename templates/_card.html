<li class="card">
  <a href="{{ url('alerta/' ~ a.id ~ '/') }}">
    <span class="tag tag-{{ a.hazard }}">{{ a.hazard_label }}</span>
    <span class="card-title">{{ a.title }}</span>
    <span class="meta">{{ a.date | human_date }}{% if a.brands %} · {{ a.brands | join(', ') }}{% endif %}</span>
  </a>
</li>
